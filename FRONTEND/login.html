<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | TechForge</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="auth-shell">
        <a class="brand" href="index.html">TECH<span>FORGE</span></a>
        <section class="auth-card">
            <div class="auth-icon"><i class="fa-solid fa-user"></i></div>
            <p class="eyebrow">BIENVENIDO DE NUEVO</p>
            <h1>Iniciar sesión</h1>
            <p class="subtitle">Accede a tu cuenta para continuar con tu compra.</p>

            <form id="loginForm">
                <label for="email">Correo electrónico</label>
                <div class="field">
                    <i class="fa-regular fa-envelope"></i>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
                </div>

                <label for="password">Contraseña</label>
                <div class="field">
                    <i class="fa-solid fa-lock"></i>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
                    <button class="toggle-password" type="button" aria-label="Mostrar contraseña"><i class="fa-regular fa-eye"></i></button>
                </div>

                <p class="message" id="message" role="alert"></p>
                <button class="primary" id="submitButton" type="submit">Iniciar sesión <i class="fa-solid fa-arrow-right"></i></button>
            </form>

            <p class="switch">¿Aún no tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
            <a class="back" href="carrito.html"><i class="fa-solid fa-arrow-left"></i> Volver al carrito</a>
        </section>
        <p class="foot">TECHFORGE · Tecnología para construir más</p>
    </main>
    <script src="login.js"></script>
</body>
</html>
