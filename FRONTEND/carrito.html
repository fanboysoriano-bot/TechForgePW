<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu pedido | TechForge</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--red:#c10000;--red-d:#9a0000;--gold:#c5a059;--dark:#111;--dark2:#1a1a1a;--bg:#f4f4f5;--line:#e3e3e6;--txt:#1a1a1a;--mut:#666;--ok:#1a8f3c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0}
a{color:inherit}

/* Barra superior */
.top{background:var(--dark);color:#fff;border-bottom:1px solid #2a2a2a}
.top-in{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:2px;text-decoration:none;color:#fff}
.brand span{color:var(--red)}
.steps{display:flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap}
.steps div{display:flex;align-items:center;gap:6px;color:#888;padding:6px 10px;border-radius:20px}
.steps div b{width:22px;height:22px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center;font-size:12px}
.steps div.on{color:#fff;background:#222}
.steps div.on b{background:var(--red)}
.steps div.done{color:var(--gold)}
.steps div.done b{background:var(--gold);color:#111}

/* Layout */
.wrap{max-width:1100px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.wrap.single{grid-template-columns:1fr;max-width:720px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
h2{font-family:Georgia,serif;font-size:22px;margin-bottom:16px}
h3{font-family:Georgia,serif;font-size:17px;margin-bottom:12px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:8px;font-weight:700;font-size:14px;text-decoration:none}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-d)}
.btn-red:disabled{background:#bbb;cursor:not-allowed}
.btn-line{background:#fff;color:var(--txt);border:1px solid #ccc}
.btn-line:hover{border-color:#888}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}

/* Productos del carrito */
.item{display:grid;grid-template-columns:90px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item .im{width:90px;height:90px;border-radius:10px;background:#f1f1f3;overflow:hidden;display:grid;place-items:center;font-size:30px;color:#999}
.item .im img{width:100%;height:100%;object-fit:contain}
.item h4{font-size:15px;margin-bottom:4px}
.item .meta{font-size:12px;color:var(--mut);margin-bottom:8px}
.item .unit{font-size:13px;color:var(--mut)}
.qty{display:inline-flex;align-items:center;border:1px solid #ccc;border-radius:8px;overflow:hidden;margin-top:6px}
.qty button{width:32px;height:32px;background:#fafafa;font-size:16px}
.qty button:hover{background:#eee}
.qty b{min-width:36px;text-align:center;font-size:14px}
.right{text-align:right}
.sub{font-weight:800;font-size:16px}
.del{background:none;color:var(--red);font-size:13px;margin-top:8px}
.del:hover{text-decoration:underline}
@media(max-width:560px){.item{grid-template-columns:70px 1fr}.item .im{width:70px;height:70px}.item .right{grid-column:1/-1;text-align:left;display:flex;justify-content:space-between;align-items:center}}

/* Resumen */
.side{position:sticky;top:16px}
.srow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;color:#333}
.srow.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:18px;font-weight:800;color:var(--txt)}
.srow.free{color:var(--ok)}
.hint{font-size:12px;color:var(--mut);margin-top:10px;padding:10px;background:#faf6ee;border-radius:8px;border:1px dashed var(--gold)}
.mini{max-height:180px;overflow:auto;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:8px}
.mini .srow{font-size:13px}

/* Formularios */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#333}
label.f.full{grid-column:1/-1}
input.i{padding:11px 12px;border:1px solid #ccc;border-radius:8px;font-size:14px;font-family:inherit;width:100%}
input.i:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red)}
input.i.bad{border-color:var(--red);background:#fff6f6}
.err{color:var(--red);font-size:12px;font-weight:500;min-height:14px}

/* Direcciones */
.addr{display:flex;gap:12px;padding:14px;border:2px solid var(--line);border-radius:10px;margin-bottom:12px;cursor:pointer;align-items:flex-start}
.addr:hover{border-color:#bbb}
.addr.sel{border-color:var(--red);background:#fff8f8}
.addr input{margin-top:4px;accent-color:var(--red)}
.addr .t{font-size:14px;line-height:1.5}
.addr .t small{color:var(--mut)}
.addr .rm{margin-left:auto;background:none;color:var(--red);font-size:12px}
.formbox{border:1px dashed #bbb;border-radius:10px;padding:18px;margin-top:8px;background:#fafafa}

/* Tarjeta */
.paygrid{display:grid;grid-template-columns:1fr;gap:20px}
.cc{background:linear-gradient(135deg,#222,#000 60%,#3a0000);color:#fff;border-radius:14px;padding:20px;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.25);margin-bottom:6px}
.cc .chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#e8cf94,#b48a3a);margin-bottom:18px}
.cc .num{font-family:ui-monospace,Consolas,monospace;font-size:19px;letter-spacing:2px;margin-bottom:16px}
.cc .row{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;gap:10px}
.cc .br{font-weight:800;color:var(--gold);font-size:13px}
.secure{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center;margin-top:12px}
.banner{background:#fff0f0;border:1px solid #f2b8b8;color:var(--red-d);padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:14px}
.demo{font-size:12px;color:#7a5c1e;background:#faf6ee;border:1px dashed var(--gold);border-radius:8px;padding:10px 12px;margin-bottom:14px;line-height:1.5}

/* Confirmación */
.okc{text-align:center}
.okc .big{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:34px;margin:0 auto 14px}
.okc .oid{display:inline-block;background:#111;color:var(--gold);padding:6px 14px;border-radius:20px;font-family:ui-monospace,Consolas,monospace;font-size:14px;margin:8px 0 18px}
.det{text-align:left;border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.det p{font-size:14px;line-height:1.6;color:#333;margin-bottom:10px}

/* Vacío y procesando */
.empty{text-align:center;padding:50px 20px;color:var(--mut)}
.empty i{font-size:48px;color:var(--gold);display:block;margin-bottom:14px}
.proc{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:50;color:#fff;text-align:center}
.proc.on{display:grid}
.spin{width:54px;height:54px;border:5px solid #444;border-top-color:var(--red);border-radius:50%;animation:s 0.9s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--mut);font-size:12px;padding:30px 20px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="index.html">TECH<span>FORGE</span></a>
    <div class="steps" id="steps"></div>
  </div>
</header>

<main class="wrap" id="wrap">
  <section id="view"></section>
  <aside class="side card" id="side"></aside>
</main>

<div class="proc" id="proc"><div><div class="spin"></div><p id="proctxt">Procesando pago…</p></div></div>

<footer>Prototipo académico · Los pagos son simulados, no se realiza ningún cobro real.</footer>

<script>
/* ======================= Configuración ======================= */
const LS_CART = 'tf_cart';
const LS_ADDR = 'tf_direcciones';
const LS_ORD  = 'tf_pedidos';
const ENVIO = 150;          // costo de envío
const ENVIO_GRATIS = 2000;  // envío gratis a partir de este subtotal

/* ======================= Utilidades ======================= */
const $ = id => document.getElementById(id);
const mx = n => "$" + Number(n || 0).toLocaleString("es-MX") + " MXN";
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let P = [];                       // productos desde la API
let cart = load(LS_CART, {});     // { sku: cantidad }
let addrs = load(LS_ADDR, []);    // direcciones guardadas
let step = 1;
let addrId = addrs[0]?.id || null;
let showForm = addrs.length === 0;
let lastOrder = null;

function imagen(x) {
  const imgs = Array.isArray(x.imagenes) ? x.imagenes : [];
  const url = imgs.find(i => typeof i === 'string' && i.includes('res.cloudinary.com')) ||
              imgs.find(i => typeof i === 'string' && i.startsWith('https://'));
  return url ? `<img src="${esc(url)}" alt="${esc(x.nombre)}" loading="lazy" onerror="this.remove()">`
             : `<i class="fa-solid fa-microchip"></i>`;
}

function items() {
  return Object.entries(cart)
    .map(([sku, n]) => ({ p: P.find(p => p.sku === sku), n: Number(n) }))
    .filter(x => x.p && x.n > 0);
}
function totals() {
  const subtotal = items().reduce((s, { p, n }) => s + p.precio * n, 0);
  const envio = subtotal === 0 ? 0 : (subtotal >= ENVIO_GRATIS ? 0 : ENVIO);
  return { subtotal, envio, total: subtotal + envio };
}
function persistCart() { save(LS_CART, cart); }

function setQty(sku, n) {
  const p = P.find(p => p.sku === sku);
  if (!p) return;
  n = Math.min(p.stock, n);
  if (n <= 0) delete cart[sku]; else cart[sku] = n;
  persistCart();
}

/* ======================= Pasos (barra superior) ======================= */
function stepper() {
  const names = ['Carrito', 'Dirección', 'Pago', 'Confirmación'];
  $('steps').innerHTML = names.map((n, i) => {
    const k = i + 1;
    const cls = k === step ? 'on' : (k < step ? 'done' : '');
    return `<div class="${cls}"><b>${k < step ? '<i class="fa-solid fa-check"></i>' : k}</b>${n}</div>`;
  }).join('');
}

/* ======================= Paso 1: carrito ======================= */
function cartHTML() {
  const L = items();
  if (!L.length) {
    return `<div class="card empty">
      <i class="fa-solid fa-bag-shopping"></i>
      <h2>Tu carrito está vacío</h2>
      <p style="margin-bottom:20px">Agrega componentes desde el catálogo para continuar.</p>
      <a class="btn btn-red" href="index.html">Ir al catálogo</a>
    </div>`;
  }
  return `<div class="card">
    <h2>Tu carrito (${L.reduce((s, x) => s + x.n, 0)} piezas)</h2>
    ${L.map(({ p, n }) => `
      <div class="item">
        <div class="im">${imagen(p)}</div>
        <div>
          <h4>${esc(p.nombre)}</h4>
          <div class="meta">${esc(p.marca)} · ${esc(p.subcategoria)} · SKU ${esc(p.sku)}</div>
          <div class="unit">${mx(p.precio)} c/u · ${p.stock} en stock</div>
          <div class="qty">
            <button data-a="dec" data-s="${esc(p.sku)}" aria-label="Menos">−</button>
            <b>${n}</b>
            <button data-a="inc" data-s="${esc(p.sku)}" aria-label="Más" ${n >= p.stock ? 'disabled' : ''}>+</button>
          </div>
        </div>
        <div class="right">
          <div class="sub">${mx(p.precio * n)}</div>
          <button class="del" data-a="del" data-s="${esc(p.sku)}"><i class="fa-solid fa-trash"></i> Quitar</button>
        </div>
      </div>`).join('')}
    <div class="actions">
      <a class="btn btn-line" href="index.html"><i class="fa-solid fa-arrow-left"></i> Seguir comprando</a>
      <button class="btn btn-red" data-a="go" data-s="2">Continuar <i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </div>`;
}

/* ======================= Paso 2: dirección ======================= */
function addrHTML() {
  const list = addrs.map(a => `
    <div class="addr ${a.id === addrId ? 'sel' : ''}" data-a="pick" data-s="${a.id}">
      <input type="radio" name="addr" ${a.id === addrId ? 'checked' : ''} tabindex="-1">
      <div class="t">
        <b>${esc(a.nombre)}</b> · <small>${esc(a.tel)}</small><br>
        ${esc(a.calle)}, ${esc(a.colonia)}<br>
        ${esc(a.cp)} ${esc(a.ciudad)}, ${esc(a.estado)}
        ${a.ref ? `<br><small>Ref: ${esc(a.ref)}</small>` : ''}
      </div>
      <button class="rm" data-a="deladdr" data-s="${a.id}"><i class="fa-solid fa-trash"></i></button>
    </div>`).join('');

  const form = `
    <div class="formbox">
      <h3>Nueva dirección</h3>
      <div class="grid2">
        <label class="f">Nombre completo<input class="i" id="a-nombre" autocomplete="name"><small class="err" id="e-a-nombre"></small></label>
        <label class="f">Teléfono (10 dígitos)<input class="i" id="a-tel" inputmode="numeric" maxlength="10" autocomplete="tel"><small class="err" id="e-a-tel"></small></label>
        <label class="f full">Calle y número<input class="i" id="a-calle" autocomplete="street-address"><small class="err" id="e-a-calle"></small></label>
        <label class="f">Colonia<input class="i" id="a-colonia"><small class="err" id="e-a-colonia"></small></label>
        <label class="f">Código postal<input class="i" id="a-cp" inputmode="numeric" maxlength="5" autocomplete="postal-code"><small class="err" id="e-a-cp"></small></label>
        <label class="f">Ciudad / Alcaldía<input class="i" id="a-ciudad"><small class="err" id="e-a-ciudad"></small></label>
        <label class="f">Estado<input class="i" id="a-estado"><small class="err" id="e-a-estado"></small></label>
        <label class="f full">Referencias (opcional)<input class="i" id="a-ref" placeholder="Entre calles, color de fachada..."></label>
      </div>
      <div class="actions" style="margin-top:14px">
        ${addrs.length ? `<button class="btn btn-line" data-a="canceladdr">Cancelar</button>` : '<span></span>'}
        <button class="btn btn-red" data-a="saveaddr">Guardar dirección</button>
      </div>
    </div>`;

  return `<div class="card">
    <h2>¿A dónde enviamos tu pedido?</h2>
    ${addrs.length ? list : '<p style="color:var(--mut);margin-bottom:12px">Aún no tienes direcciones guardadas.</p>'}
    ${showForm ? form : `<button class="btn btn-line" data-a="newaddr"><i class="fa-solid fa-plus"></i> Agregar nueva dirección</button>`}
    <div class="actions">
      <button class="btn btn-line" data-a="go" data-s="1"><i class="fa-solid fa-arrow-left"></i> Volver</button>
      <button class="btn btn-red" data-a="go" data-s="3" ${addrId && !showForm ? '' : 'disabled'}>Continuar al pago <i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </div>`;
}

function validateAddr() {
  const v = id => $(id).value.trim();
  const rules = {
    'a-nombre': [v('a-nombre').length >= 3, 'Escribe tu nombre completo'],
    'a-tel': [/^\d{10}$/.test(v('a-tel')), 'Debe tener 10 dígitos'],
    'a-calle': [v('a-calle').length >= 3, 'Escribe calle y número'],
    'a-colonia': [v('a-colonia').length >= 2, 'Escribe la colonia'],
    'a-cp': [/^\d{5}$/.test(v('a-cp')), 'Código postal de 5 dígitos'],
    'a-ciudad': [v('a-ciudad').length >= 2, 'Escribe la ciudad'],
    'a-estado': [v('a-estado').length >= 2, 'Escribe el estado']
  };
  let ok = true;
  for (const [id, [pass, msg]] of Object.entries(rules)) {
    $(id).classList.toggle('bad', !pass);
    $('e-' + id).textContent = pass ? '' : msg;
    if (!pass) ok = false;
  }
  return ok;
}

function saveAddr() {
  if (!validateAddr()) return;
  const a = {
    id: 'a' + Date.now(),
    nombre: $('a-nombre').value.trim(), tel: $('a-tel').value.trim(),
    calle: $('a-calle').value.trim(), colonia: $('a-colonia').value.trim(),
    cp: $('a-cp').value.trim(), ciudad: $('a-ciudad').value.trim(),
    estado: $('a-estado').value.trim(), ref: $('a-ref').value.trim()
  };
  addrs.push(a);
  save(LS_ADDR, addrs);
  addrId = a.id;
  showForm = false;
  render();
}

/* ======================= Paso 3: pago con tarjeta ======================= */
function payHTML() {
  const t = totals();
  const a = addrs.find(x => x.id === addrId);
  return `<div class="card">
    <h2>Pago con tarjeta</h2>
    <div class="demo"><b>Modo simulación:</b> usa <b>4242 4242 4242 4242</b> para un pago aprobado, o <b>4000 0000 0000 0002</b> para ver un rechazo. Cualquier fecha futura y CVV de 3 dígitos.</div>
    <div id="payerr"></div>
    <div class="paygrid">
      <div>
        <div class="cc">
          <div class="chip"></div>
          <div class="num" id="pv-num">•••• •••• •••• ••••</div>
          <div class="row"><span id="pv-name">Nombre del titular</span><span id="pv-exp">MM/AA</span></div>
          <div class="row" style="margin-top:10px"><span class="br" id="pv-br">&nbsp;</span></div>
        </div>
      </div>
      <div class="grid2">
        <label class="f full">Número de tarjeta
          <input class="i" id="c-num" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" maxlength="19">
          <small class="err" id="e-c-num"></small></label>
        <label class="f full">Nombre del titular
          <input class="i" id="c-name" autocomplete="cc-name" placeholder="Como aparece en la tarjeta">
          <small class="err" id="e-c-name"></small></label>
        <label class="f">Vencimiento
          <input class="i" id="c-exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA" maxlength="5">
          <small class="err" id="e-c-exp"></small></label>
        <label class="f">CVV
          <input class="i" id="c-cvv" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4" type="password">
          <small class="err" id="e-c-cvv"></small></label>
      </div>
    </div>
    <div class="secure"><i class="fa-solid fa-lock"></i> Por seguridad, el número completo y el CVV nunca se guardan; solo los últimos 4 dígitos.</div>
    <p style="font-size:13px;color:var(--mut);margin-top:14px"><i class="fa-solid fa-location-dot"></i> Envío a: ${a ? esc(a.calle) + ', ' + esc(a.colonia) + ', ' + esc(a.cp) : '—'}</p>
    <div class="actions">
      <button class="btn btn-line" data-a="go" data-s="2"><i class="fa-solid fa-arrow-left"></i> Volver</button>
      <button class="btn btn-red" data-a="pay"><i class="fa-solid fa-lock"></i> Pagar ${mx(t.total)}</button>
    </div>
  </div>`;
}

const digits = s => s.replace(/\D/g, '');
function brand(n) {
  if (/^4/.test(n)) return 'Visa';
  if (/^(5[1-5]|2[2-7])/.test(n)) return 'Mastercard';
  if (/^3[47]/.test(n)) return 'American Express';
  return '';
}
function luhn(n) {
  let sum = 0, alt = false;
  for (let i = n.length - 1; i >= 0; i--) {
    let d = +n[i];
    if (alt) { d *= 2; if (d > 9) d -= 9; }
    sum += d; alt = !alt;
  }
  return sum % 10 === 0;
}
function fmtNum(raw) {
  const n = digits(raw);
  if (/^3[47]/.test(n)) {
    const a = n.slice(0, 15);
    return [a.slice(0, 4), a.slice(4, 10), a.slice(10)].filter(Boolean).join(' ');
  }
  return n.slice(0, 16).replace(/(.{4})/g, '$1 ').trim();
}
function fmtExp(raw) {
  const n = digits(raw).slice(0, 4);
  return n.length > 2 ? n.slice(0, 2) + '/' + n.slice(2) : n;
}

function updatePreview() {
  const n = digits($('c-num').value);
  const padded = (fmtNum(n) + ' ••••••••••••••••').slice(0, /^3[47]/.test(n) ? 17 : 19);
  $('pv-num').textContent = n ? padded : '•••• •••• •••• ••••';
  $('pv-name').textContent = $('c-name').value.trim() || 'Nombre del titular';
  $('pv-exp').textContent = $('c-exp').value || 'MM/AA';
  $('pv-br').textContent = brand(n) || '\u00a0';
}

function validatePay() {
  const num = digits($('c-num').value);
  const name = $('c-name').value.trim();
  const exp = $('c-exp').value;
  const cvv = $('c-cvv').value;
  const amex = /^3[47]/.test(num);

  const m = +exp.slice(0, 2), y = 2000 + +exp.slice(3, 5);
  const expFormat = /^\d{2}\/\d{2}$/.test(exp) && m >= 1 && m <= 12;
  const notExpired = expFormat && new Date(y, m, 1) > new Date();

  const rules = {
    'c-num': [(amex ? num.length === 15 : num.length === 16) && luhn(num), 'Número de tarjeta inválido'],
    'c-name': [name.length >= 3 && /\s/.test(name), 'Escribe nombre y apellido'],
    'c-exp': [notExpired, expFormat ? 'La tarjeta está vencida' : 'Usa el formato MM/AA'],
    'c-cvv': [amex ? /^\d{4}$/.test(cvv) : /^\d{3}$/.test(cvv), amex ? 'CVV de 4 dígitos' : 'CVV de 3 dígitos']
  };
  let ok = true;
  for (const [id, [pass, msg]] of Object.entries(rules)) {
    $(id).classList.toggle('bad', !pass);
    $('e-' + id).textContent = pass ? '' : msg;
    if (!pass) ok = false;
  }
  return ok;
}

function pay() {
  $('payerr').innerHTML = '';
  if (!validatePay()) return;

  // Se leen los datos solo para validar y mostrar los últimos 4 dígitos.
  const num = digits($('c-num').value);
  const info = { marca: brand(num) || 'Tarjeta', ultimos4: num.slice(-4) };
  const rechazada = num === '4000000000000002';

  // Se borran los datos sensibles del formulario de inmediato
  $('c-num').value = ''; $('c-cvv').value = '';

  $('proctxt').textContent = 'Procesando pago…';
  $('proc').classList.add('on');

  setTimeout(() => { $('proctxt').textContent = 'Verificando con el banco…'; }, 1100);
  setTimeout(() => {
    $('proc').classList.remove('on');
    if (rechazada) {
      render();
      $('payerr').innerHTML = `<div class="banner"><i class="fa-solid fa-circle-xmark"></i> Pago rechazado por el banco (simulación). Intenta con otra tarjeta.</div>`;
      return;
    }
    createOrder(info);
  }, 2400);
}

function createOrder(pago) {
  const t = totals();
  const dir = addrs.find(a => a.id === addrId);
  const hoy = new Date();
  lastOrder = {
    id: 'TF-' + hoy.toISOString().slice(0, 10).replace(/-/g, '') + '-' + String(Math.floor(Math.random() * 9000) + 1000),
    fecha: hoy.toISOString(),
    items: items().map(({ p, n }) => ({ sku: p.sku, nombre: p.nombre, precio: p.precio, cantidad: n })),
    direccion: dir,
    pago,                       // solo marca y últimos 4 dígitos
    subtotal: t.subtotal, envio: t.envio, total: t.total,
    estado: 'Pagado (simulado)'
  };
  const hist = load(LS_ORD, []);
  hist.push(lastOrder);
  save(LS_ORD, hist);

  cart = {};
  persistCart();
  step = 4;
  render();
}

/* ======================= Paso 4: confirmación ======================= */
function confirmHTML() {
  const o = lastOrder;
  const d = o.direccion;
  return `<div class="card okc">
    <div class="big"><i class="fa-solid fa-check"></i></div>
    <h2 style="margin-bottom:4px">¡Gracias por tu compra!</h2>
    <p style="color:var(--mut)">Tu pedido fue registrado correctamente (simulación).</p>
    <div class="oid">${esc(o.id)}</div>
    <div class="det">
      <h3>Productos</h3>
      ${o.items.map(i => `<div class="srow"><span>${i.cantidad}× ${esc(i.nombre)}</span><span>${mx(i.precio * i.cantidad)}</span></div>`).join('')}
      <div class="srow"><span>Envío</span><span>${o.envio ? mx(o.envio) : 'Gratis'}</span></div>
      <div class="srow tot"><span>Total pagado</span><span>${mx(o.total)}</span></div>
    </div>
    <div class="det">
      <p><b><i class="fa-solid fa-location-dot"></i> Enviar a:</b><br>
        ${esc(d.nombre)} · ${esc(d.tel)}<br>${esc(d.calle)}, ${esc(d.colonia)}<br>${esc(d.cp)} ${esc(d.ciudad)}, ${esc(d.estado)}</p>
      <p><b><i class="fa-solid fa-credit-card"></i> Pago:</b> ${esc(o.pago.marca)} terminada en ${esc(o.pago.ultimos4)}</p>
    </div>
    <div class="actions" style="justify-content:center">
      <a class="btn btn-red" href="index.html">Volver al catálogo</a>
    </div>
  </div>`;
}

/* ======================= Resumen lateral ======================= */
function summaryHTML() {
  const t = totals();
  const falta = ENVIO_GRATIS - t.subtotal;
  return `<h3>Resumen del pedido</h3>
    ${step > 1 ? `<div class="mini">${items().map(({ p, n }) =>
      `<div class="srow"><span>${n}× ${esc(p.nombre.slice(0, 28))}${p.nombre.length > 28 ? '…' : ''}</span><span>${mx(p.precio * n)}</span></div>`).join('')}</div>` : ''}
    <div class="srow"><span>Subtotal</span><span>${mx(t.subtotal)}</span></div>
    <div class="srow ${t.envio === 0 && t.subtotal ? 'free' : ''}"><span>Envío</span><span>${t.subtotal === 0 ? '—' : (t.envio ? mx(t.envio) : 'Gratis')}</span></div>
    <div class="srow tot"><span>Total</span><span>${mx(t.total)}</span></div>
    ${t.subtotal && falta > 0 ? `<div class="hint"><i class="fa-solid fa-truck"></i> Te faltan ${mx(falta)} para envío gratis.</div>` : ''}`;
}

/* ======================= Render principal ======================= */
function render() {
  if (step < 4 && !items().length) step = 1;
  stepper();
  const single = step === 4;
  $('wrap').classList.toggle('single', single);
  $('side').style.display = single ? 'none' : '';
  if (single) { $('view').innerHTML = confirmHTML(); return; }
  $('view').innerHTML = [null, cartHTML, addrHTML, payHTML][step]();
  $('side').innerHTML = summaryHTML();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ======================= Eventos ======================= */
$('view').addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const a = el.dataset.a, s = el.dataset.s;

  if (a === 'inc') { setQty(s, (cart[s] || 0) + 1); render(); }
  else if (a === 'dec') { setQty(s, (cart[s] || 0) - 1); render(); }
  else if (a === 'del') { setQty(s, 0); render(); }
  else if (a === 'go') { step = Number(s); render(); }
  else if (a === 'pick') { if (e.target.closest('[data-a="deladdr"]')) return; addrId = s; render(); }
  else if (a === 'deladdr') {
    e.stopPropagation();
    addrs = addrs.filter(x => x.id !== s);
    save(LS_ADDR, addrs);
    if (addrId === s) addrId = addrs[0]?.id || null;
    showForm = addrs.length === 0;
    render();
  }
  else if (a === 'newaddr') { showForm = true; render(); }
  else if (a === 'canceladdr') { showForm = false; render(); }
  else if (a === 'saveaddr') saveAddr();
  else if (a === 'pay') pay();
});

$('view').addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'c-num') { t.value = fmtNum(t.value); updatePreview(); }
  else if (t.id === 'c-exp') { t.value = fmtExp(t.value); updatePreview(); }
  else if (t.id === 'c-cvv') { t.value = digits(t.value).slice(0, 4); }
  else if (t.id === 'c-name') { updatePreview(); }
  else if (t.id === 'a-tel') { t.value = digits(t.value).slice(0, 10); }
  else if (t.id === 'a-cp') { t.value = digits(t.value).slice(0, 5); }
});

/* ======================= Inicio ======================= */
async function init() {
  $('view').innerHTML = '<div class="card empty"><i class="fa-solid fa-spinner fa-spin"></i><p>Cargando tu carrito…</p></div>';
  try {
    const res = await fetch('/api/productos');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    P = data.map(x => ({ ...x, stock: Number(x.stock || 0), precio: Number(x.precio || 0) }));
    // Ajusta cantidades que ya no coincidan con el stock actual
    Object.keys(cart).forEach(sku => setQty(sku, Math.min(Number(cart[sku]), (P.find(p => p.sku === sku)?.stock) || 0)));
    render();
  } catch (err) {
    console.error(err);
    $('view').innerHTML = `<div class="card empty"><i class="fa-solid fa-triangle-exclamation" style="color:var(--red)"></i>
      <h2>No se pudo cargar el carrito</h2>
      <p style="margin-bottom:18px">Verifica que el servidor esté activo.</p>
      <a class="btn btn-red" href="index.html">Volver al catálogo</a></div>`;
  }
}
init();
</script>
