
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | TechForge</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="auth-shell">
        <a class="brand" href="index.html">TECH<span>FORGE</span></a>

        <section class="auth-card">
            <div class="auth-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <p class="eyebrow">ÚNETE A TECHFORGE</p>
            <h1>Crear cuenta</h1>
            <p class="subtitle">
                Regístrate para guardar tus datos y continuar tus compras.
            </p>

            <form id="registerForm">

                <label for="nombre">Nombre completo</label>
                <div class="field">
                    <i class="fa-regular fa-user"></i>
                    <input
                        id="nombre"
                        name="nombre"
                        type="text"
                        autocomplete="name"
                        placeholder="Tu nombre completo"
                        minlength="3"
                        maxlength="80"
                        required
                    >
                </div>

                <label for="email">Correo electrónico</label>
                <div class="field">
                    <i class="fa-regular fa-envelope"></i>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="tucorreo@ejemplo.com"
                        maxlength="160"
                        required
                    >
                </div>

                <label for="password">Contraseña</label>
                <div class="field">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Mínimo 8 caracteres"
                        minlength="8"
                        maxlength="72"
                        required
                    >
                    <button class="toggle-password" type="button" aria-label="Mostrar contraseña">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <label for="confirmPassword">Confirmar contraseña</label>
                <div class="field">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Repite tu contraseña"
                        minlength="8"
                        maxlength="72"
                        required
                    >
                </div>

                <div class="address-heading">
                    <p class="eyebrow">DATOS DE ENTREGA</p>
                    <h2>Tu dirección</h2>
                    <p class="subtitle">
                        Guardaremos este domicilio para facilitar tus próximas compras.
                    </p>
                </div>

                <label for="calle">Calle</label>
                <div class="field">
                    <i class="fa-solid fa-road"></i>
                    <input
                        id="calle"
                        name="calle"
                        type="text"
                        autocomplete="address-line1"
                        placeholder="Nombre de la calle"
                        maxlength="100"
                        required
                    >
                </div>

                <label for="numero">Número exterior / interior</label>
                <div class="field">
                    <i class="fa-solid fa-house"></i>
                    <input
                        id="numero"
                        name="numero"
                        type="text"
                        placeholder="Ej. 125, int. 2"
                        maxlength="30"
                        required
                    >
                </div>

                <label for="colonia">Colonia</label>
                <div class="field">
                    <i class="fa-solid fa-location-dot"></i>
                    <input
                        id="colonia"
                        name="colonia"
                        type="text"
                        autocomplete="address-level3"
                        placeholder="Tu colonia"
                        maxlength="100"
                        required
                    >
                </div>

                <label for="municipio">Municipio o alcaldía</label>
                <div class="field">
                    <i class="fa-solid fa-city"></i>
                    <input
                        id="municipio"
                        name="municipio"
                        type="text"
                        autocomplete="address-level2"
                        placeholder="Tu municipio o alcaldía"
                        maxlength="100"
                        required
                    >
                </div>

                <label for="estado">Estado</label>
                <div class="field">
                    <i class="fa-solid fa-map"></i>
                    <input
                        id="estado"
                        name="estado"
                        type="text"
                        autocomplete="address-level1"
                        placeholder="Tu estado"
                        maxlength="100"
                        required
                    >
                </div>

                <label for="codigoPostal">Código postal</label>
                <div class="field">
                    <i class="fa-solid fa-envelopes-bulk"></i>
                    <input
                        id="codigoPostal"
                        name="codigoPostal"
                        type="text"
                        inputmode="numeric"
                        autocomplete="postal-code"
                        placeholder="5 dígitos"
                        pattern="[0-9]{5}"
                        maxlength="5"
                        required
                    >
                </div>

                <label for="referencias">Referencias del domicilio (opcional)</label>
                <div class="field">
                    <i class="fa-regular fa-comment"></i>
                    <input
                        id="referencias"
                        name="referencias"
                        type="text"
                        placeholder="Ej. Casa de dos pisos, portón negro"
                        maxlength="200"
                    >
                </div>

                <p class="message" id="message" role="alert"></p>

                <button class="primary" id="submitButton" type="submit">
                    Crear cuenta
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <p class="switch">
                ¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>

            <a class="back" href="carrito.html">
                <i class="fa-solid fa-arrow-left"></i>
                Volver al carrito
            </a>
        </section>

        <p class="foot">TECHFORGE · Tecnología para construir más</p>
    </main>

    <script src="registro.js"></script>
</body>
</html>
