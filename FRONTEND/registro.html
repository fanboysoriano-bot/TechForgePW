<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | TechForge</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="auth-shell">
        <a class="brand" href="index.html">TECH<span>FORGE</span></a>
        <section class="auth-card">
            <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
            <p class="eyebrow">ÚNETE A TECHFORGE</p>
            <h1>Crear cuenta</h1>
            <p class="subtitle">Regístrate para guardar tus datos y continuar tus compras.</p>

            <form id="registerForm">
                <label for="nombre">Nombre completo</label>
                <div class="field">
                    <i class="fa-regular fa-user"></i>
                    <input id="nombre" name="nombre" type="text" autocomplete="name" placeholder="Tu nombre" minlength="3" maxlength="80" required>
                </div>

                <label for="email">Correo electrónico</label>
                <div class="field">
                    <i class="fa-regular fa-envelope"></i>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
                </div>

                <label for="password">Contraseña</label>
                <div class="field">
                    <i class="fa-solid fa-lock"></i>
                    <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8" maxlength="72" required>
                    <button class="toggle-password" type="button" aria-label="Mostrar contraseña"><i class="fa-regular fa-eye"></i></button>
                </div>

                <label for="confirmPassword">Confirmar contraseña</label>
                <div class="field">
                    <i class="fa-solid fa-lock"></i>
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repite tu contraseña" minlength="8" required>
                </div>

                <p class="message" id="message" role="alert"></p>
                <button class="primary" id="submitButton" type="submit">Crear cuenta <i class="fa-solid fa-arrow-right"></i></button>
            </form>

            <p class="switch">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
            <a class="back" href="carrito.html"><i class="fa-solid fa-arrow-left"></i> Volver al carrito</a>
        </section>
        <p class="foot">TECHFORGE · Tecnología para construir más</p>
    </main>
    <script src="registro.js"></script>
</body>
</html>
