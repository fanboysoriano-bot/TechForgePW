
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | TechForge</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="login-container">
        <section class="login-card">

            <div class="logo">TECH<span>FORGE</span></div>

            <div class="admin-icon">🛡️</div>

            <h1>Panel administrativo</h1>
            <p class="subtitle">Inicia sesión para gestionar los pedidos.</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="admin@techforge.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >
                </div>

                <p id="mensaje" class="mensaje"></p>

                <button type="submit" id="btnLogin">
                    Iniciar sesión
                </button>

            </form>

            <a href="../index.html" class="volver">Volver a la tienda</a>

        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
