
name: Crear e implementar una aplicación Node.js en Azure Web App - TechForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: BACKEND

      - name: Construir backend
        run: npm run build --if-present
        working-directory: BACKEND

      - name: Ejecutar pruebas
        run: npm run test --if-present
        working-directory: BACKEND

      - name: Cargar archivos para Azure
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B9C41A6ED18F45B7B1DAF359324C2F61 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BCD32B25B77346B5A930B07EC4E36E8D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_30AB751188D54BA4930853E0E5FE927F }}

      - name: Implementar en Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: TechForge
          slot-name: Production
          package: .
